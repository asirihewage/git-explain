<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="'SF Mono','JetBrains Mono','Fira Code',monospace" font-size="13">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#0f0f17"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2d2d3f"/>
      <stop offset="100%" stop-color="#252535"/>
    </linearGradient>
  </defs>

  <!-- Terminal shadow -->
  <rect x="6" y="6" width="720" height="540" rx="10" fill="#000" opacity="0.3"/>

  <!-- Terminal body -->
  <rect x="0" y="0" width="720" height="540" rx="8" fill="url(#bg)"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="720" height="34" rx="8" fill="url(#title)"/>
  <rect x="0" y="26" width="720" height="8" fill="url(#title)"/>

  <!-- Window buttons -->
  <circle cx="18" cy="17" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="17" r="6" fill="#febc2e"/>
  <circle cx="58" cy="17" r="6" fill="#28c840"/>

  <!-- Title text -->
  <text x="360" y="22" text-anchor="middle" fill="#8a8a9e" font-size="12">git explain — git explain --staged</text>

  <!-- Output -->
  <text x="24" y="62" fill="#565677" font-size="12">  Files: 7   +36 / -51</text>

  <text x="24" y="90" fill="#7aa2f7" font-weight="bold" font-size="13">  Change Analysis</text>
  <text x="24" y="108" fill="#3d4055" font-size="11">──────────────────────────────────────────────────</text>

  <!-- Summary -->
  <text x="24" y="136" fill="#7aa2f7" font-size="13">  📌  Summary</text>
  <text x="24" y="158" fill="#c0caf5">    Switches the default AI model from deepseek-v4-flash</text>
  <text x="24" y="176" fill="#c0caf5">    to qwen3-coder, refactors git diff parsing, and</text>
  <text x="24" y="194" fill="#c0caf5">    separates .npmrc from version control.</text>

  <!-- Why -->
  <text x="24" y="226" fill="#e0af68" font-size="13">  🎯  Why This Change Was Made</text>
  <text x="24" y="248" fill="#c0caf5">    The primary motivation is switching the default AI</text>
  <text x="24" y="266" fill="#c0caf5">    model to qwen3-coder for better availability.</text>

  <!-- Regressions -->
  <text x="24" y="298" fill="#f7768e" font-size="13">  ⚠️  Potential Regressions</text>
  <text x="24" y="320" fill="#c0caf5">    - Users expecting deepseek-v4-flash by default</text>
  <text x="24" y="338" fill="#c0caf5">      may need to manually configure it</text>
  <text x="24" y="356" fill="#c0caf5">    - Modified parseDiffResult may have edge cases</text>
  <text x="24" y="374" fill="#c0caf5">      in complex Git scenarios</text>

  <!-- Affected Modules -->
  <text x="24" y="406" fill="#bb9af7" font-size="13">  🔗  Affected Modules</text>
  <text x="24" y="428" fill="#c0caf5">    - src/config.ts — Default model change</text>
  <text x="24" y="446" fill="#c0caf5">    - src/git.ts — Fixed staged diff stats</text>
  <text x="24" y="464" fill="#c0caf5">    - src/llm/ollama.ts — Enhanced type safety</text>

  <!-- Commit Message -->
  <text x="24" y="496" fill="#9ece6a" font-size="13">  💾  Suggested Commit Message</text>
  <text x="24" y="518" fill="#c0caf5">    feat: switch default model to qwen3-coder and</text>
  <text x="24" y="536" fill="#c0caf5">    improve Ollama integration</text>
</svg>
